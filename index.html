<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Полуночный синтез</title>
<style>
:root{--ink:#34271e;--wood:#795236;--cream:#f4e8d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(#d8d0bd 0 35%,#b9a58a 35% 100%)}
.lab{max-width:1080px;margin:auto;padding:16px}
h1{text-align:center;margin:4px 0;font-size:clamp(25px,4vw,38px)}
.sub{text-align:center;font:14px Arial,sans-serif;margin:0 0 14px;color:#594838}
.window{height:65px;max-width:420px;margin:0 auto 12px;border:8px solid #76563d;background:linear-gradient(90deg,transparent 49%,#76563d 49% 51%,transparent 51%),linear-gradient(transparent 48%,#76563d 48% 52%,transparent 52%),linear-gradient(#b8d0d0,#e9dfc7)}
.shelf-wrap{background:linear-gradient(90deg,#6d472c,#a7774d 12%,#8c5e3b 88%,#674329);padding:12px;border:7px solid #604027;border-radius:7px;box-shadow:0 10px 18px #38281955}
.shelf-title{text-align:center;color:#f8e8d2;font:bold 13px Arial,sans-serif;letter-spacing:.15em;margin-bottom:10px}
.rack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.slot{height:178px;position:relative;border:3px solid #5d3b25;border-radius:5px;background:linear-gradient(#e9d9bd,#d2b995);box-shadow:inset 0 2px 8px #65462955;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
.slot:after{content:"";position:absolute;bottom:0;left:-2px;right:-2px;height:8px;background:#69452b;box-shadow:0 3px 3px #0003}
.slot-num{position:absolute;top:5px;left:7px;font:bold 12px Arial,sans-serif;color:#67452e;z-index:4}
.slot-hint{position:absolute;right:7px;top:5px;font:10px Arial,sans-serif;color:#7b6045;z-index:4}
.symbol-layer{position:absolute;width:100px;height:100px;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.shelf-fragment{opacity:.72}
.bottle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2;touch-action:none}
.bottle:active{cursor:grabbing}
.bottle.selected{background:#f9e9a044;outline:3px solid #e6bd4c;outline-offset:-6px}
.bottle-glass{width:82px;height:108px;position:relative;border:2px solid #67848a;border-radius:12px 12px 18px 18px;background:linear-gradient(90deg,#ffffff55,#c4e2e566 45%,#ffffff66);box-shadow:inset -7px 0 10px #789da044;display:flex;align-items:center;justify-content:center}
.bottle-glass:before{content:"";position:absolute;top:-18px;width:29px;height:19px;border:2px solid #67848a;border-bottom:0;border-radius:5px 5px 0 0;background:#d8ecec}
.bottle-glass:after{content:"";position:absolute;bottom:8px;left:6px;right:6px;height:20px;background:#c6a16d55;border-radius:3px}
.bottle-fragment{width:100px;height:100px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none}
.bottle-id{position:absolute;bottom:12px;z-index:4;background:#f3e6cae8;border:1px solid #987a56;border-radius:3px;padding:2px 8px;font:bold 12px Arial,sans-serif}
.slot.over{outline:3px solid #f3d16b;outline-offset:-5px}
.bottle-shelf{margin-top:18px;padding:12px 12px 16px;background:linear-gradient(90deg,#6d472c,#a7774d 12%,#8c5e3b 88%,#674329);border:7px solid #604027;border-radius:7px;box-shadow:0 10px 18px #38281955}
.bottle-rack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.bottle-cell{height:125px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(#e9d9bd,#d2b995);border:2px solid #5d3b25;border-radius:5px;box-shadow:inset 0 2px 8px #65462955;touch-action:manipulation}
.bottle-cell:after{content:"";position:absolute;bottom:0;left:0;right:0;height:7px;background:#69452b}
.bottle-cell .bottle{position:absolute}
.bottle-cell.over{outline:3px solid #f3d16b;outline-offset:-5px}
@media(max-width:650px){.bottle-rack{gap:4px}.bottle-cell{height:105px}.bottle-shelf{padding:8px 6px 12px}}
@media(max-width:390px){.bottle-cell{height:88px}}
.overlay{position:fixed;inset:0;background:#20170dcc;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}.win{background:#f5e8d2;border:5px solid #8c6745;border-radius:9px;padding:28px;text-align:center;max-width:420px;box-shadow:0 15px 45px #0007}
.win-screenshot{font:italic 16px Georgia,serif;color:#7a4d2c;margin:14px 0 0}
@media(max-width:650px){.lab{padding:10px 7px}.rack{gap:5px}.slot{height:145px}.bottle-glass{width:65px;height:88px}.symbol-layer,.bottle-fragment{width:84px;height:84px}.slot-num{font-size:11px}.slot-hint{font-size:8px}}
@media(max-width:390px){.slot{height:125px}.bottle-glass{width:55px;height:76px}.symbol-layer,.bottle-fragment{width:72px;height:72px}}
</style></head>
<body><main class="lab">
<h1>Полуночный синтез</h1><div class="window"></div>
<section class="shelf-wrap"><div class="shelf-title">СТЕЛЛАЖ</div><div class="rack" id="rack"></div></section>
<section class="bottle-shelf"><div class="bottle-rack" id="bank"></div></section>
</main>
<div class="overlay" id="overlay"><div class="win"><h2>Поздравляю! Вам удалось найти слабость сущности!</h2><p class="win-screenshot">Отправь скриншот кураторам)</p></div></div>
<script>
const rack=document.getElementById('rack'),bank=document.getElementById('bank');
const N=12;let positions=Array(N).fill(null),selected=null,dragged=null,moves=0;
const partitions = [
 [
  ['M20 20H80 M20 20V80','M80 20V80 M20 80H80 M20 20L80 80 M80 20L20 80'],
  ['M80 20V80 M20 80H80','M20 20H80 M20 20V80 M20 20L80 80 M80 20L20 80'],
  ['M20 20L80 80 M80 20L20 80','M20 20H80 M80 20V80 M20 80H80 M20 20V80'],
  ['M20 20H80 M80 20V80 M20 20L80 80','M20 20V80 M20 80H80 M80 20L20 80']
 ],
 [
  ['M50 14A36 36 0 1 0 50 86','M50 14A36 36 0 1 1 50 86 M25 30H75L25 70H75'],
  ['M50 14A36 36 0 0 1 50 86 M25 30H75','M50 14A36 36 0 0 0 50 86 M25 70H75 M75 30L25 70'],
  ['M25 30H75 M25 70H75','M50 14A36 36 0 1 0 50 86 M50 14A36 36 0 1 1 50 86 M75 30L25 70'],
  ['M50 14A36 36 0 1 0 50 86 M75 30L25 70','M50 14A36 36 0 1 1 50 86 M25 30H75 M25 70H75']
 ],
 [
  ['M50 10L74 82 M50 10L26 82 M50 10L90 36','M50 10L10 36 M10 36L90 36 M10 36L74 82 M90 36L26 82 M74 82L26 82 M74 82L10 36 M26 82L90 36'],
  ['M10 36L90 36 M10 36L74 82','M50 10L74 82 M50 10L26 82 M50 10L90 36 M50 10L10 36 M90 36L26 82 M74 82L26 82 M74 82L10 36 M26 82L90 36'],
  ['M50 10L10 36 M90 36L26 82 M74 82L26 82','M50 10L74 82 M50 10L26 82 M50 10L90 36 M10 36L90 36 M10 36L74 82 M74 82L10 36 M26 82L90 36'],
  ['M50 10L74 82 M50 10L26 82 M10 36L90 36 M74 82L10 36','M50 10L90 36 M50 10L10 36 M10 36L74 82 M90 36L26 82 M74 82L26 82 M26 82L90 36']
 ]
];
function partFor(row,index,which){
 const color='#684b32';
 return `<path d="${partitions[row][index][which]}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function art(mark,cls){return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${mark}</svg>`}
function bottleHTML(id){
 const row=Math.floor(id/4),within=id%4;
 return `<div class="bottle" draggable="true" data-id="${id}" aria-label="Колба">
 <div class="bottle-glass"></div>${art(partFor(row,within,1),'bottle-fragment')}</div>`;
}
function render(){
 rack.innerHTML='';bank.innerHTML='';
 positions.forEach((id,slot)=>{
  const row=Math.floor(slot/4),el=document.createElement('div');
  el.className='slot';el.dataset.slot=slot;
  el.innerHTML=`${art(partFor(row,slot%4,0),'symbol-layer shelf-fragment')}${id===null?'':bottleHTML(id)}`;
  rack.appendChild(el);
 });
 const remaining=Array.from({length:N},(_,id)=>id).filter(id=>!positions.includes(id));
 remaining.forEach(id=>{
  const cell=document.createElement('div');cell.className='bottle-cell';cell.dataset.bank='1';
  cell.innerHTML=bottleHTML(id);bank.appendChild(cell);
 });
 document.querySelectorAll('.bottle').forEach(b=>{
  b.addEventListener('click',e=>{e.stopPropagation();choose(+b.dataset.id)});
  b.addEventListener('dragstart',e=>{dragged=+b.dataset.id;e.dataTransfer.setData('text/plain',String(dragged))});
  b.addEventListener('dragend',()=>{dragged=null});
 });
 document.querySelectorAll('.slot,.bottle-cell').forEach(cell=>{
  cell.addEventListener('click',()=>{
   if(cell.classList.contains('slot'))chooseSlot(+cell.dataset.slot);
   else {
    if(selected!==null){returnBottleToBank(selected);}
    else {const b=cell.querySelector('.bottle');if(b)choose(+b.dataset.id);}
   }
  });
  cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('over')});
  cell.addEventListener('dragleave',()=>cell.classList.remove('over'));
  cell.addEventListener('drop',e=>{
   e.preventDefault();cell.classList.remove('over');
   const id=dragged??Number(e.dataTransfer.getData('text/plain'));
   if(cell.classList.contains('slot'))moveTo(+cell.dataset.slot,id);
   else returnBottleToBank(id);
  });
 });
}
function choose(id){
 if(selected===null){selected=id;render();const b=document.querySelector(`.bottle[data-id="${id}"]`);if(b)b.classList.add('selected');return}
 if(selected===id){selected=null;render();return}
 const target=positions.indexOf(id);
 if(target>=0)moveTo(target,selected);
 else {const from=positions.indexOf(selected);if(from>=0){positions[from]=null;} selected=null;render();}
}
function chooseSlot(slot){
 if(selected===null){if(positions[slot]!==null)choose(positions[slot]);return}
 moveTo(slot,selected);
}
function moveTo(slot,id){
 const from=positions.indexOf(id);
 if(from===slot){selected=null;render();return}
 const displaced=positions[slot];
 if(from>=0)positions[from]=displaced;
 positions[slot]=id;selected=null;moves++;render();
 if(positions.every((v,i)=>v===i))document.getElementById('overlay').classList.add('show');
}
function returnBottleToBank(id){
 const from=positions.indexOf(id);
 if(from>=0){
  positions[from]=null;
  selected=null;
  moves++;
  render();
 }
}
function shuffle(){
 const ids=Array.from({length:N},(_,i)=>i);
 do{for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}}
 while(ids.every((v,i)=>v===i));
 positions=Array(N).fill(null);selected=null;moves=0;render();
}
shuffle();
</script></body></html>
